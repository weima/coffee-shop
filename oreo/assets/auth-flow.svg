<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="auth-flow-title auth-flow-desc" id="auth-flow-root">
        <title id="auth-flow-title">Oreo provider authentication flow</title>
        <desc id="auth-flow-desc">Alternative Codex and GitHub Copilot subscription sign-in sequences. Codex uses PKCE and a temporary loopback callback, with device-code login for headless use; Copilot uses GitHub device authorization and a Copilot token exchange. Both save named credentials to Oreo's private auth file.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #auth-flow-root { --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #auth-flow-root { color: var(--ink); font-family: var(--sans); }
      #auth-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #auth-flow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="auth-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="auth-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="auth-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="960" height="600" fill="#f5f5f5"/>

        <text x="40" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">SESSION PROVIDER / MODEL / THINKING OVERRIDES DEFAULTS; CALLER CHOOSES THE ACCOUNT.</text>
        <text x="40" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">CODEX: PKCE + TEMPORARY LOOPBACK (HEADLESS: DEVICE CODE) · COPILOT: USER APPROVES GITHUB DEVICE CODE.</text>

        <!-- Lifelines -->
        <line x1="160" y1="120" x2="160" y2="496" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="120" x2="480" y2="496" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="800" y1="120" x2="800" y2="496" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Oreo Auth is active while a login flow is in progress. -->
        <rect x="476" y="188" width="8" height="296" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- One ALT fragment selects the provider-specific login flow. -->
        <rect x="56" y="136" width="848" height="344" rx="4" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/>
        <rect x="56" y="136" width="40" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/>
        <text x="76" y="148" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

        <!-- Codex region -->
        <rect x="104" y="156" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="104" y="165" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">[CODEX]</text>

        <line x1="480" y1="192" x2="160" y2="192" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#auth-flow-arrow-link)"/>
        <rect x="224" y="176" width="192" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="186" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">AUTHORIZE · PKCE + STATE</text>

        <line x1="160" y1="216" x2="480" y2="216" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#auth-flow-arrow-link)"/>
        <rect x="208" y="200" width="224" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="210" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">REDIRECT · CODE + STATE</text>

        <line x1="480" y1="240" x2="160" y2="240" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#auth-flow-arrow-link)"/>
        <rect x="216" y="224" width="208" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="234" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">EXCHANGE · CODE + VERIFIER</text>

        <line x1="160" y1="264" x2="480" y2="264" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#auth-flow-arrow-link)"/>
        <rect x="232" y="248" width="176" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="258" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ACCESS + REFRESH TOKENS</text>

        <line x1="480" y1="288" x2="800" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#auth-flow-arrow)"/>
        <rect x="536" y="272" width="208" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="282" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SAVE NAMED ACCOUNT</text>

        <!-- ALT divider -->
        <line x1="64" y1="316" x2="896" y2="316" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- Copilot region -->
        <rect x="104" y="324" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="104" y="333" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">[COPILOT]</text>

        <line x1="480" y1="360" x2="160" y2="360" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#auth-flow-arrow-link)"/>
        <rect x="216" y="344" width="208" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="354" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">REQUEST GITHUB DEVICE CODE</text>

        <line x1="160" y1="384" x2="480" y2="384" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#auth-flow-arrow-link)"/>
        <rect x="208" y="368" width="224" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="378" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">DEVICE CODE + VERIFICATION URL</text>

        <line x1="480" y1="408" x2="160" y2="408" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#auth-flow-arrow-link)"/>
        <rect x="232" y="392" width="176" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="402" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">AFTER APPROVAL · POLL + EXCHANGE</text>

        <line x1="160" y1="432" x2="480" y2="432" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#auth-flow-arrow-link)"/>
        <rect x="216" y="416" width="208" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="426" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">COPILOT ACCESS + REFRESH</text>

        <line x1="480" y1="456" x2="800" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#auth-flow-arrow)"/>
        <rect x="536" y="440" width="208" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="450" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SAVE NAMED ACCOUNT</text>

        <!-- Actors, drawn over lifelines and message ends. -->
        <g>
          <rect x="88" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="88" y="64" width="144" height="56" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
          <rect x="96" y="72" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
          <text x="120" y="81" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROVIDER</text>
          <text x="160" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Identity provider</text>
          <text x="160" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OpenAI / GitHub / Copilot</text>
        </g>

        <g>
          <rect x="408" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="408" y="64" width="144" height="56" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
          <rect x="416" y="72" width="44" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
          <text x="438" y="81" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OREO</text>
          <text x="480" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Oreo Auth</text>
          <text x="480" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PKCE · device · refresh</text>
        </g>

        <g>
          <rect x="728" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="728" y="64" width="144" height="56" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
          <rect x="736" y="72" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
          <text x="756" y="81" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
          <text x="800" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Oreo auth.json</text>
          <text x="800" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">work + personal</text>
        </g>

        <!-- Token lifecycle summary -->
        <text x="40" y="500" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">After login: sessions use the selected account; refresh on expiry. If refresh is rejected, the caller re-runs the provider login.</text>

        <!-- Legend -->
        <line x1="40" y1="524" x2="920" y2="524" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="550" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LEGEND</text>
        <line x1="112" y1="546" x2="148" y2="546" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#auth-flow-arrow-link)"/>
        <text x="160" y="550" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">REQUEST</text>
        <line x1="264" y1="546" x2="300" y2="546" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#auth-flow-arrow-link)"/>
        <text x="312" y="550" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PROVIDER RESPONSE</text>
        <line x1="472" y1="546" x2="508" y2="546" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#auth-flow-arrow)"/>
        <text x="520" y="550" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">STORE WRITE</text>
        <rect x="656" y="538" width="32" height="16" rx="2" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/>
        <text x="672" y="550" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">ALT</text>
        <text x="696" y="550" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PROVIDER CHOICE</text>
      </svg>
