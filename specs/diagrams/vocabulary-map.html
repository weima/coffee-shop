<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Coffee Shop vocabulary: how the parts fit</h1>

    <!-- Replace vocabulary-map with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vocabulary-map-title vocabulary-map-desc">
        <title id="vocabulary-map-title">Coffee Shop vocabulary: how the parts fit</title>
        <desc id="vocabulary-map-desc">Flowchart from Order to Recipe to Brew, then Shots, Workers, Stations, the Tray, the Register and the Receipt.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

        <path d="M140 116 L140 190" stroke="#4f5d75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
        <path d="M240 218 L340 218" stroke="#4f5d75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
        <path d="M540 218 L640 158" stroke="#4f5d75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
        <path d="M740 186 L740 250" stroke="#4f5d75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
        <path d="M740 306 L740 370" stroke="#4f5d75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
        <path d="M640 398 L540 398" stroke="#4f5d75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
        <path d="M440 246 L440 370" stroke="#4f5d75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
        <path d="M340 246 L140 370" stroke="#4f5d75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
        <path d="M140 426 L140 470" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>
        <text x="236" y="296" font-size="12" fill="#4f5d75" font-family="Geist, system-ui, sans-serif">status</text>
        <text x="152" y="452" font-size="12" fill="#4f5d75" font-family="Geist, system-ui, sans-serif">explains status</text>

        <rect x="40" y="60" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="140" y="84" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142" font-family="Geist, system-ui, sans-serif">Order</text>
        <text x="140" y="102" text-anchor="middle" font-size="12" fill="#4f5d75" font-family="Geist, system-ui, sans-serif">outcome asked for</text>

        <rect x="40" y="190" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="140" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142" font-family="Geist, system-ui, sans-serif">Recipe</text>
        <text x="140" y="232" text-anchor="middle" font-size="12" fill="#4f5d75" font-family="Geist, system-ui, sans-serif">explicit list of Shots</text>

        <rect x="340" y="190" width="200" height="56" rx="20" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="440" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142" font-family="Geist, system-ui, sans-serif">Brew</text>
        <text x="440" y="232" text-anchor="middle" font-size="12" fill="#4f5d75" font-family="Geist, system-ui, sans-serif">one run of a Recipe</text>

        <rect x="640" y="130" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="740" y="154" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142" font-family="Geist, system-ui, sans-serif">Shot</text>
        <text x="740" y="172" text-anchor="middle" font-size="12" fill="#4f5d75" font-family="Geist, system-ui, sans-serif">one unit of work</text>

        <rect x="640" y="250" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="740" y="274" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142" font-family="Geist, system-ui, sans-serif">Worker</text>
        <text x="740" y="292" text-anchor="middle" font-size="12" fill="#4f5d75" font-family="Geist, system-ui, sans-serif">Pi process for one Shot</text>

        <rect x="640" y="370" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="740" y="394" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142" font-family="Geist, system-ui, sans-serif">Station</text>
        <text x="740" y="412" text-anchor="middle" font-size="12" fill="#4f5d75" font-family="Geist, system-ui, sans-serif">Git worktree for one Shot</text>

        <rect x="340" y="370" width="200" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="440" y="394" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142" font-family="Geist, system-ui, sans-serif">Tray</text>
        <text x="440" y="412" text-anchor="middle" font-size="12" fill="#4f5d75" font-family="Geist, system-ui, sans-serif">review packet</text>

        <rect x="40" y="370" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="140" y="394" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142" font-family="Geist, system-ui, sans-serif">Register</text>
        <text x="140" y="412" text-anchor="middle" font-size="12" fill="#4f5d75" font-family="Geist, system-ui, sans-serif">current status</text>

        <rect x="40" y="470" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="140" y="494" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142" font-family="Geist, system-ui, sans-serif">Receipt</text>
        <text x="140" y="512" text-anchor="middle" font-size="12" fill="#4f5d75" font-family="Geist, system-ui, sans-serif">append-only history</text>

      </svg>
    </div>
  </div>
</body>
</html>
