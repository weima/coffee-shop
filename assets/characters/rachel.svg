    <circle cx="78" cy="199" r="9" fill="#E8B85F"/>
    <path d="M75 200c0-2 2-3 3-2 2-1 4 0 4 2 0 3-3 4-4 5-1-1-3-2-3-5Zm-3-4c-1-2 0-3 1-3s2 2 2 3-2 2-3 0Zm7-1c0-2 1-3 2-3s2 2 1 3-2 1-3 0Z" fill="#4A3027"/>
